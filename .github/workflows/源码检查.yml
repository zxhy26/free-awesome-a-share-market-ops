name: 源码检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 验证公开源码
        shell: powershell
        run: npm test
