name: Publish Verified Release Assets

on:
  push:
    branches:
      - "release-assets/**"
    paths:
      - ".release-upload/**"

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4

      - name: Reassemble and verify assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          transfer_root = Path(".release-upload")
          output_root = Path(".release-output")
          output_root.mkdir(exist_ok=True)
          manifest = json.loads((transfer_root / "manifest.json").read_text(encoding="utf-8"))
          tag = str(manifest.get("tag", ""))
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("invalid release tag")
          for asset in manifest.get("assets", []):
              name = str(asset.get("name", ""))
              if not name or Path(name).name != name:
                  raise SystemExit(f"invalid asset name: {name}")
              target = output_root / name
              with target.open("wb") as destination:
                  for chunk_name in asset.get("chunks", []):
                      chunk = transfer_root / str(chunk_name)
                      if not chunk.is_file():
                          raise SystemExit(f"missing chunk: {chunk_name}")
                      with chunk.open("rb") as source:
                          while block := source.read(4 * 1024 * 1024):
                              destination.write(block)
              actual_hash = hashlib.sha256(target.read_bytes()).hexdigest().upper()
              if actual_hash != str(asset.get("sha256", "")).upper():
                  raise SystemExit(f"asset hash mismatch: {name}")
              if target.stat().st_size != int(asset.get("size", -1)):
                  raise SystemExit(f"asset size mismatch: {name}")
              print(f"verified {name}: {actual_hash}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"RELEASE_TAG={tag}\n")
          PY

      - name: Upload verified assets to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: .release-output/*
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true

      - name: Verify published asset names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > published-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path(".release-upload/manifest.json").read_text(encoding="utf-8"))
          published = json.loads(Path("published-assets.json").read_text(encoding="utf-8"))
          names = {asset["name"] for asset in published.get("assets", [])}
          missing = [asset["name"] for asset in manifest.get("assets", []) if asset["name"] not in names]
          if missing:
              raise SystemExit("missing published assets: " + ", ".join(missing))
          PY
