<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef0f2">
  <title>行情详情｜A股复盘</title>
  <link rel="icon" href="../assets/icons/favicon-32.png">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/mobile-detail.css">
</head>
<body>
  <main class="detail-shell internal-detail-shell market-detail-shell">
    <header class="detail-header internal-detail-header">
      <div>
        <p class="internal-detail-eyebrow">软件内行情</p>
        <h1 id="marketDetailTitle">行情详情</h1>
        <p id="marketDetailSubtitle">正在读取对应股票或板块</p>
      </div>
      <nav class="detail-actions" aria-label="行情详情操作">
        <button class="button" id="marketDetailBack" type="button">返回上一页</button>
        <a class="button" href="../index.html">返回首页</a>
        <button class="button button-primary" id="marketDetailRefresh" type="button">刷新数据</button>
        <fieldset class="theme-segment" aria-label="主题模式">
          <legend class="visually-hidden">主题模式</legend>
          <button type="button" data-theme-choice="system">跟随</button>
          <button type="button" data-theme-choice="light">浅色</button>
          <button type="button" data-theme-choice="dark">深色</button>
        </fieldset>
      </nav>
    </header>

    <div class="internal-detail-status" id="marketDetailStatus" aria-live="polite">读取中</div>
    <section class="market-detail-metrics" id="marketDetailMetrics" aria-label="行情指标"></section>

    <section class="market-chart-section" aria-label="日K图">
      <div class="market-chart-header">
        <div>
          <h2>日 K 走势</h2>
          <p id="marketChartCaption">仅绘制公开接口返回的真实日线</p>
        </div>
        <div class="market-range-control" id="marketRangeControl" role="group" aria-label="日K显示范围">
          <button type="button" data-range="20">20日</button>
          <button type="button" data-range="60" aria-pressed="true">60日</button>
          <button type="button" data-range="120">120日</button>
        </div>
      </div>
      <div class="market-candle-chart" id="marketCandleChart"></div>
      <p class="market-chart-empty" id="marketChartEmpty" hidden></p>
      <div class="market-chart-legend" aria-label="日K图例">
        <span><i class="candle-up"></i>上涨</span>
        <span><i class="candle-down"></i>下跌</span>
        <span><i class="ma-five"></i>MA5</span>
        <span><i class="ma-ten"></i>MA10</span>
      </div>
    </section>

    <section class="internal-detail-section" aria-label="相关信息">
      <h2>相关信息</h2>
      <div id="marketDetailContext"></div>
    </section>

    <section class="internal-detail-section" aria-label="数据说明">
      <h2>数据说明</h2>
      <div id="marketDetailSources"></div>
    </section>
  </main>
  <script type="module" src="../assets/js/mobile-market-detail.js"></script>
</body>
</html>
